  <rect y="106" width="1920" height="4" fill="#48D2C7"/>
  <text x="960" y="48" class="cn title" text-anchor="middle">高反光精密异形零件表面形貌检测技术路线图</text>
  <text x="960" y="83" class="cn subtitle" text-anchor="middle">多模态感知 · 精密测量 · 智能评价 · 装备集成 · 工程验证</text>

  <!-- Goal -->
  <g filter="url(#shadow)">
    <rect x="180" y="135" width="1560" height="76" rx="18" fill="#fff" stroke="#9ACED1" stroke-width="2"/>
  </g>
  <circle cx="228" cy="173" r="25" fill="#118A91"/>
  <path d="M214 173l10 10 19-22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="270" y="166" class="cn" font-size="21" font-weight="800" fill="#0B5871">总体目标</text>
  <text x="270" y="193" class="cn" font-size="18" fill="#315469">面向高反光、弱纹理、复杂异形表面，构建“核心部件—算法软件—检测装备—行业应用”自主技术体系</text>

  <!-- Stage ribbons -->
