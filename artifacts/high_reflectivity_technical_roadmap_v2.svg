  <path d="M81 427c16-19 38-23 51-5" fill="none" stroke="#fff" stroke-width="6" opacity=".9"/>
  <path d="M77 447c18-15 36-17 51-5" fill="none" stroke="#fff" stroke-width="4" opacity=".7"/>
