<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFD"/><stop offset="1" stop-color="#EAF3F7"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07385C"/><stop offset="0.58" stop-color="#0A6380"/><stop offset="1" stop-color="#108F8C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#153F56" flood-opacity=".14"/>
    </filter>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1A7293"/>
    </marker>
    <marker id="at" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#15998F"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#D67A24"/>
    </marker>
    <style>
      .cn{font-family:"WenQuanYi Micro Hei","Droid Sans Fallback","Microsoft YaHei",sans-serif}
      .title{font-size:36px;font-weight:800;fill:#fff}.subtitle{font-size:21px;fill:#d7f5f4}
      .ct{font-size:23px;font-weight:800;fill:#fff}.unit{font-size:15px;fill:#eaf8fb}
      .body{font-size:18px;fill:#284a5d}.small{font-size:15px;fill:#547080}.out{font-size:16px;font-weight:700;fill:#183f54}
      .tag{font-size:15px;font-weight:700}.stage{font-size:16px;font-weight:800;letter-spacing:2px}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1810" cy="115" r="250" fill="#3ED0C4" opacity=".07"/>
  <circle cx="80" cy="1020" r="250" fill="#207AA3" opacity=".05"/>

  <!-- Header -->
