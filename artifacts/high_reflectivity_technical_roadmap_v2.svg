    <line x1="426" y1="917" x2="426" y2="1000" stroke="#D7E2E8"/><line x1="782" y1="917" x2="782" y2="1000" stroke="#D7E2E8"/>
    <line x1="1138" y1="917" x2="1138" y2="1000" stroke="#D7E2E8"/><line x1="1494" y1="917" x2="1494" y2="1000" stroke="#D7E2E8"/>
    <text x="248" y="949" font-size="23" font-weight="800" fill="#1979A7">反射率 ≥ 0.8</text><text x="248" y="981" font-size="16" fill="#526D7C">复杂高反光表面稳定检测</text>
    <text x="604" y="949" font-size="23" font-weight="800" fill="#159A9C">精度优于 0.03 mm/m</text><text x="604" y="981" font-size="16" fill="#526D7C">尺寸/形位/复杂曲面偏差</text>
