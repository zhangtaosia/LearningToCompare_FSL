    <rect x="790" y="232" width="350" height="34" rx="17" fill="#E7E9F7"/><text x="965" y="255" fill="#515AA1">智能检测与评价</text>
    <rect x="1230" y="232" width="320" height="34" rx="17" fill="#F9EBDD"/><text x="1390" y="255" fill="#A85B1B">整机集成与精度保障</text>
    <rect x="1610" y="232" width="250" height="34" rx="17" fill="#E2F1E7"/><text x="1735" y="255" fill="#32744C">工程化与应用验证</text>
