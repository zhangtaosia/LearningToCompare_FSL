    <text x="1316" y="949" font-size="23" font-weight="800" fill="#D47A25">TRL &gt; 8 · MTBF ≥ 5000 h</text><text x="1316" y="981" font-size="16" fill="#526D7C">定型、小批量与长期运行</text>
    <text x="1672" y="949" font-size="23" font-weight="800" fill="#39885B">推广应用 ≥ 7套</text><text x="1672" y="981" font-size="16" fill="#526D7C">≥5家供应商目录｜效率提升10倍</text>
