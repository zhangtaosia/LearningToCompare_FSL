<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F8FC"/>
      <stop offset="1" stop-color="#E9F1F8"/>
    </linearGradient>
    <linearGradient id="titleBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#072E55"/>
      <stop offset="0.55" stop-color="#0B4F79"/>
      <stop offset="1" stop-color="#087F8C"/>
    </linearGradient>
    <linearGradient id="goalBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7F6F5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#123A54" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1E6D92"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#159A9C"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6C8797"/>
    </marker>
    <style>
      .cn { font-family: "WenQuanYi Micro Hei","Droid Sans Fallback","Noto Sans CJK SC","Microsoft YaHei",sans-serif; }
      .small { font-size: 19px; fill: #29475B; }
      .body { font-size: 20px; fill: #25465A; }
      .label { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
      .cardTitle { font-size: 27px; font-weight: 800; fill: #FFFFFF; }
      .output { font-size: 18px; font-weight: 700; fill: #173D51; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1810" cy="115" r="230" fill="#3BC5C7" opacity="0.07"/>
  <circle cx="90" cy="995" r="210" fill="#1D6FA3" opacity="0.06"/>

  <!-- Title -->
  <rect x="0" y="0" width="1920" height="116" fill="url(#titleBg)"/>
  <path d="M0 116 H1920" stroke="#41D6CA" stroke-width="5"/>
  <text x="960" y="51" class="cn" text-anchor="middle" font-size="38" font-weight="800" fill="#FFFFFF">高反光精密异形零件表面形貌检测</text>
  <text x="960" y="91" class="cn" text-anchor="middle" font-size="25" font-weight="500" fill="#CDEDF2">课题设置与总体技术路线图</text>

  <!-- Overall objective -->
  <g filter="url(#shadow)">
    <rect x="190" y="140" width="1540" height="82" rx="20" fill="url(#goalBg)" stroke="#8BC8CD" stroke-width="2"/>
  </g>
  <circle cx="245" cy="181" r="26" fill="#0E8190"/>
  <path d="M230 181 L241 192 L261 169" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="290" y="175" class="cn" font-size="23" font-weight="800" fill="#0A4E6C">总体目标</text>
  <text x="290" y="205" class="cn" font-size="20" fill="#294D60">突破“看得清—测得准—判得智—集得成—用得稳”全链条关键技术，形成自主可控检测装备并完成多行业验证</text>

  <!-- Layer labels -->
  <g class="cn">
    <rect x="36" y="260" width="32" height="468" rx="16" fill="#D8E8F2"/>
    <text x="58" y="494" writing-mode="tb" glyph-orientation-vertical="0" text-anchor="middle" font-size="18" font-weight="800" fill="#32617B">关键技术与核心部件</text>
    <rect x="36" y="758" width="32" height="74" rx="16" fill="#DCEFE9"/>
    <text x="58" y="795" writing-mode="tb" text-anchor="middle" font-size="18" font-weight="800" fill="#267060">成果输出</text>
  </g>

  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="90" y="260" width="390" height="468" rx="22" fill="#FFFFFF"/>
    <path d="M90 282 Q90 260 112 260 H458 Q480 260 480 282 V342 H90 Z" fill="#1878A8"/>
  </g>
  <!-- camera icon -->
  <g transform="translate(112 278)" fill="none" stroke="#FFFFFF" stroke-width="4">
    <rect x="0" y="11" width="51" height="37" rx="6"/>
    <circle cx="26" cy="30" r="11"/>
    <path d="M11 11 L17 2 H36 L42 11"/>
  </g>
  <text x="180" y="297" class="cn cardTitle">课题1</text>
  <text x="180" y="328" class="cn" font-size="20" font-weight="600" fill="#D7F3FF">视觉感知与工业相机</text>
  <rect x="112" y="362" width="92" height="26" rx="13" fill="#DCEFF8"/>
  <text x="158" y="381" class="cn label" text-anchor="middle" fill="#17678F">感知基础</text>
  <g class="cn body">
    <circle cx="121" cy="421" r="4" fill="#1878A8"/><text x="138" y="428">宽动态成像与反射抑制</text>
    <circle cx="121" cy="463" r="4" fill="#1878A8"/><text x="138" y="470">大视场、高分辨、低畸变光学</text>
    <circle cx="121" cy="505" r="4" fill="#1878A8"/><text x="138" y="512">高速预处理、标定与自动调焦</text>
    <circle cx="121" cy="547" r="4" fill="#1878A8"/><text x="138" y="554">散斑/纹理粗糙度视觉感知</text>
    <circle cx="121" cy="589" r="4" fill="#1878A8"/><text x="138" y="596">面投影结构光三维测量</text>
  </g>
  <rect x="112" y="628" width="346" height="76" rx="14" fill="#EAF5FA" stroke="#A8D5E7"/>
  <text x="130" y="656" class="cn output">核心产出</text>
  <text x="130" y="684" class="cn small">≥1亿像素工业相机｜散斑/纹理特征</text>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="515" y="260" width="390" height="468" rx="22" fill="#FFFFFF"/>
    <path d="M515 282 Q515 260 537 260 H883 Q905 260 905 282 V342 H515 Z" fill="#159A9C"/>
  </g>
  <!-- laser scanner icon -->
  <g transform="translate(538 277)" fill="none" stroke="#FFFFFF" stroke-width="4">
    <path d="M2 44 L20 5 L37 44 Z"/>
    <path d="M20 5 L51 20" stroke="#FFE375"/>
    <path d="M51 20 L34 36" stroke="#FFE375"/>
    <circle cx="51" cy="20" r="4" fill="#FFE375" stroke="none"/>
  </g>
  <text x="605" y="297" class="cn cardTitle">课题2</text>
  <text x="605" y="328" class="cn" font-size="20" font-weight="600" fill="#D9FFFF">三维测量与协同扫描</text>
  <rect x="537" y="362" width="92" height="26" rx="13" fill="#DDF4F1"/>
  <text x="583" y="381" class="cn label" text-anchor="middle" fill="#127577">测量基础</text>
  <g class="cn body">
    <circle cx="546" cy="421" r="4" fill="#159A9C"/><text x="563" y="428">高反光激光三角精密测量</text>
    <circle cx="546" cy="463" r="4" fill="#159A9C"/><text x="563" y="470">高精度激光位移传感器</text>
    <circle cx="546" cy="505" r="4" fill="#159A9C"/><text x="563" y="512">多轴精密运动与同步触发</text>
    <circle cx="546" cy="547" r="4" fill="#159A9C"/><text x="563" y="554">多视场点云配准与融合</text>
    <circle cx="546" cy="589" r="4" fill="#159A9C"/><text x="563" y="596">全局误差控制与协同扫描</text>
  </g>
  <rect x="537" y="628" width="346" height="76" rx="14" fill="#E8F7F5" stroke="#A7DCD6"/>
  <text x="555" y="656" class="cn output">核心产出</text>
  <text x="555" y="684" class="cn small">激光传感器｜大行程多轴平台｜点云</text>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="940" y="260" width="300" height="468" rx="22" fill="#FFFFFF"/>
    <path d="M940 282 Q940 260 962 260 H1218 Q1240 260 1240 282 V342 H940 Z" fill="#5C67B2"/>
  </g>
  <!-- AI icon -->
  <g transform="translate(962 279)" fill="none" stroke="#FFFFFF" stroke-width="3.5">
    <rect x="7" y="5" width="42" height="42" rx="8"/>
    <circle cx="20" cy="21" r="3" fill="#FFFFFF"/>
    <circle cx="36" cy="21" r="3" fill="#FFFFFF"/>
    <path d="M18 34 Q28 42 39 34"/>
    <path d="M0 17 H7 M0 34 H7 M49 17 H56 M49 34 H56"/>
  </g>
  <text x="1028" y="297" class="cn cardTitle">课题3</text>
  <text x="1028" y="328" class="cn" font-size="19" font-weight="600" fill="#E7E9FF">智能检测与评价</text>
  <rect x="962" y="362" width="92" height="26" rx="13" fill="#E9EAF8"/>
  <text x="1008" y="381" class="cn label" text-anchor="middle" fill="#4E589A">算法中枢</text>
  <g class="cn" font-size="19" fill="#25465A">
    <circle cx="971" cy="421" r="4" fill="#5C67B2"/><text x="987" y="428">几何/形位误差检测</text>
    <circle cx="971" cy="463" r="4" fill="#5C67B2"/><text x="987" y="470">微小缺陷AI识别分类</text>
    <circle cx="971" cy="505" r="4" fill="#5C67B2"/><text x="987" y="512">粗糙度参数反演评价</text>
    <circle cx="971" cy="547" r="4" fill="#5C67B2"/><text x="987" y="554">多源数据融合</text>
    <circle cx="971" cy="589" r="4" fill="#5C67B2"/><text x="987" y="596">检测软件与三维可视化</text>
  </g>
  <rect x="962" y="628" width="256" height="76" rx="14" fill="#F0F0FA" stroke="#C8CBE9"/>
  <text x="980" y="656" class="cn output">核心产出</text>
  <text x="980" y="684" class="cn" font-size="17" fill="#29475B">算法库｜检测软件｜评价结果</text>

  <!-- Card 4 -->
  <g filter="url(#shadow)">
    <rect x="1275" y="260" width="270" height="468" rx="22" fill="#FFFFFF"/>
    <path d="M1275 282 Q1275 260 1297 260 H1523 Q1545 260 1545 282 V342 H1275 Z" fill="#D07B2C"/>
  </g>
  <!-- equipment icon -->
  <g transform="translate(1297 277)" fill="none" stroke="#FFFFFF" stroke-width="3.5">
    <rect x="2" y="7" width="52" height="39" rx="5"/>
    <path d="M9 38 L20 24 L29 32 L40 18 L48 27"/>
    <path d="M18 51 H39 M28 46 V51"/>
  </g>
  <text x="1362" y="297" class="cn cardTitle">课题4</text>
  <text x="1362" y="328" class="cn" font-size="18" font-weight="600" fill="#FFF0DD">检测装备研制</text>
  <rect x="1297" y="362" width="92" height="26" rx="13" fill="#F9EBDD"/>
  <text x="1343" y="381" class="cn label" text-anchor="middle" fill="#A85B1A">系统集成</text>
  <g class="cn" font-size="18" fill="#25465A">
    <circle cx="1306" cy="421" r="4" fill="#D07B2C"/><text x="1322" y="428">模块化总体架构</text>
    <circle cx="1306" cy="463" r="4" fill="#D07B2C"/><text x="1322" y="470">光机电软协同装调</text>
    <circle cx="1306" cy="505" r="4" fill="#D07B2C"/><text x="1322" y="512">系统标定与误差补偿</text>
    <circle cx="1306" cy="547" r="4" fill="#D07B2C"/><text x="1322" y="554">多要素单次协同检测</text>
    <circle cx="1306" cy="589" r="4" fill="#D07B2C"/><text x="1322" y="596">整机研制与性能测试</text>
  </g>
  <rect x="1297" y="628" width="226" height="76" rx="14" fill="#FCF2E8" stroke="#EDC8A5"/>
  <text x="1315" y="656" class="cn output">核心产出</text>
  <text x="1315" y="684" class="cn" font-size="17" fill="#29475B">高反光形貌检测整机</text>

  <!-- Card 5 -->
  <g filter="url(#shadow)">
    <rect x="1580" y="260" width="270" height="468" rx="22" fill="#FFFFFF"/>
    <path d="M1580 282 Q1580 260 1602 260 H1828 Q1850 260 1850 282 V342 H1580 Z" fill="#39875A"/>
  </g>
  <!-- factory/application icon -->
  <g transform="translate(1602 278)" fill="none" stroke="#FFFFFF" stroke-width="3.5">
    <path d="M2 46 V20 L19 30 V18 L36 29 V8 H50 V46 Z"/>
    <path d="M10 38 H17 M26 38 H33 M41 38 H47"/>
  </g>
  <text x="1667" y="297" class="cn cardTitle">课题5</text>
  <text x="1667" y="328" class="cn" font-size="18" font-weight="600" fill="#E5F8EA">工程化与应用验证</text>
  <rect x="1602" y="362" width="92" height="26" rx="13" fill="#E2F1E7"/>
  <text x="1648" y="381" class="cn label" text-anchor="middle" fill="#2F724A">应用牵引</text>
  <g class="cn" font-size="18" fill="#25465A">
    <circle cx="1611" cy="421" r="4" fill="#39875A"/><text x="1627" y="428">环境适应与可靠性</text>
    <circle cx="1611" cy="463" r="4" fill="#39875A"/><text x="1627" y="470">工程定型与小批量生产</text>
    <circle cx="1611" cy="505" r="4" fill="#39875A"/><text x="1627" y="512">典型场景工艺适配</text>
    <circle cx="1611" cy="547" r="4" fill="#39875A"/><text x="1627" y="554">多用户长期运行验证</text>
    <circle cx="1611" cy="589" r="4" fill="#39875A"/><text x="1627" y="596">行业示范与规模推广</text>
  </g>
  <rect x="1602" y="628" width="226" height="76" rx="14" fill="#EAF5ED" stroke="#B8D9C3"/>
  <text x="1620" y="656" class="cn output">核心产出</text>
  <text x="1620" y="684" class="cn" font-size="17" fill="#29475B">TRL&gt;8｜用户认可｜推广应用</text>

  <!-- Main-flow arrows -->
  <path d="M480 440 C500 440 495 440 515 440" fill="none" stroke="#1E6D92" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M905 475 C922 475 923 475 940 475" fill="none" stroke="#1E6D92" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M1240 475 C1255 475 1260 475 1275 475" fill="none" stroke="#1E6D92" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M1545 475 C1560 475 1565 475 1580 475" fill="none" stroke="#159A9C" stroke-width="5" marker-end="url(#arrowTeal)"/>

  <!-- Cross links -->
  <path d="M285 728 V770 H1340 V728" fill="none" stroke="#6C8797" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowGray)"/>
  <path d="M710 728 V750 H1410 V728" fill="none" stroke="#6C8797" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowGray)"/>
  <rect x="707" y="746" width="314" height="34" rx="17" fill="#E4EDF2" stroke="#B7CAD5"/>
  <text x="864" y="769" class="cn" text-anchor="middle" font-size="16" font-weight="700" fill="#4D6A7B">相机＋传感器＋平台＋软件 → 整机集成</text>

  <!-- Information labels above flow -->
  <g class="cn" font-size="15" font-weight="700" fill="#527080">
    <text x="497" y="425" text-anchor="middle">多模态数据</text>
    <text x="922" y="460" text-anchor="middle">特征/点云</text>
    <text x="1257" y="460" text-anchor="middle">算法软件</text>
    <text x="1562" y="460" text-anchor="middle">装备样机</text>
  </g>

  <!-- Feedback loop -->
  <path d="M1715 728 V812 C1715 832 1695 842 1675 842 H245 C225 842 205 832 205 812 V788"
        fill="none" stroke="#39875A" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#arrowTeal)"/>
  <rect x="780" y="820" width="360" height="38" rx="19" fill="#E5F2E9" stroke="#9FC6AB"/>
  <text x="960" y="846" class="cn" text-anchor="middle" font-size="17" font-weight="700" fill="#2F724A">用户需求与现场数据闭环反馈 · 持续迭代优化</text>

  <!-- KPI footer -->
  <rect x="90" y="884" width="1760" height="152" rx="24" fill="#FFFFFF" stroke="#BFD2DD" stroke-width="2" filter="url(#shadow)"/>
  <rect x="90" y="884" width="1760" height="40" rx="24" fill="#183F59"/>
  <rect x="90" y="904" width="1760" height="20" fill="#183F59"/>
  <text x="960" y="912" class="cn" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">总体考核目标（2029年10月）</text>
  <g class="cn">
    <line x1="442" y1="940" x2="442" y2="1019" stroke="#D5E1E7" stroke-width="2"/>
    <line x1="794" y1="940" x2="794" y2="1019" stroke="#D5E1E7" stroke-width="2"/>
    <line x1="1146" y1="940" x2="1146" y2="1019" stroke="#D5E1E7" stroke-width="2"/>
    <line x1="1498" y1="940" x2="1498" y2="1019" stroke="#D5E1E7" stroke-width="2"/>
    <text x="266" y="968" text-anchor="middle" font-size="24" font-weight="800" fill="#1878A8">反射率 ≥ 0.8</text>
    <text x="266" y="999" text-anchor="middle" font-size="17" fill="#4A6575">复杂高反光表面稳定检测</text>
    <text x="618" y="968" text-anchor="middle" font-size="24" font-weight="800" fill="#159A9C">精度优于 0.03 mm/m</text>
    <text x="618" y="999" text-anchor="middle" font-size="17" fill="#4A6575">尺寸/形位/曲面偏差</text>
    <text x="970" y="968" text-anchor="middle" font-size="24" font-weight="800" fill="#5C67B2">范围 ≥ 2×1×0.5 m</text>
    <text x="970" y="999" text-anchor="middle" font-size="17" fill="#4A6575">多要素单次协同获取</text>
    <text x="1322" y="968" text-anchor="middle" font-size="24" font-weight="800" fill="#D07B2C">TRL &gt; 8 · MTBF ≥ 5000 h</text>
    <text x="1322" y="999" text-anchor="middle" font-size="17" fill="#4A6575">工程定型与长期可靠运行</text>
    <text x="1674" y="968" text-anchor="middle" font-size="24" font-weight="800" fill="#39875A">多行业 ≥ 7 套应用</text>
    <text x="1674" y="999" text-anchor="middle" font-size="17" fill="#4A6575">≥5家供应商目录 · 效率提升10倍</text>
  </g>
  <text x="1860" y="1065" class="cn" text-anchor="end" font-size="14" fill="#78909D">技术链：感知 → 测量 → 评价 → 装备 → 应用</text>
</svg>
